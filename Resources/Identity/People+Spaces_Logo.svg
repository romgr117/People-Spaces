<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 260" width="1400" height="260">
  <title>PEOPLE + SPACES</title>
  <desc>Minimalist interior design wordmark using Abel-style lettering, a perfect circular O, and an equilateral triangle in place of A.</desc>

  <rect width="1400" height="260" fill="#ffffff"/>

  <!-- Wordmark -->
  <g fill="#222222"
     font-family="Abel, 'Helvetica Neue', Arial, sans-serif"
     font-size="112"
     font-weight="400"
     letter-spacing="0">
    <text x="150" y="170">PE</text>

    <!-- Perfect circle O, optically matched to the letter height -->
    <circle cx="333" cy="132" r="48"
            fill="none" stroke="#222222" stroke-width="2.4"/>

    <text x="390" y="170">PLE</text>

    <!-- Geometric plus -->
    <g stroke="#222222" stroke-width="2.4">
      <line x1="595" y1="132" x2="635" y2="132"/>
      <line x1="615" y1="112" x2="615" y2="152"/>
    </g>

    <text x="665" y="170">SP</text>

    <!-- Perfect equilateral triangle replacing A -->
    <polygon points="808,84 863.4,180 752.6,180"
             fill="none" stroke="#222222" stroke-width="2.4"/>

    <text x="878" y="170">CES</text>
  </g>
</svg>
